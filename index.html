<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicBook Downloader</title>
    <style>
        :root { --primary: #6366F1; --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --muted: #94A3B8; --success: #10B981; --error: #FB7185; --border: #334155; }
        body.light-theme { --bg: #F3F4F6; --card: #FFFFFF; --text: #1F2937; --muted: #6B7280; --border: #E5E7EB; }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: var(--card); padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 550px; text-align: center; position: relative; }
        .controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
        .btn-icon { background: none; border: 1px solid var(--border); color: var(--muted); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        input { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text); margin-bottom: 15px; outline: none; }
        
        .options-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .opt-btn { flex: 1; padding: 10px 5px; border: 1px solid var(--border); border-radius: 10px; background: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .opt-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(99, 102, 241, 0.1); }

        button#mainBtn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
        button#mainBtn:disabled { opacity: 0.5; }
        
        .chapters-box { display: none; text-align: left; margin: 20px 0; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; max-height: 180px; overflow-y: auto; border: 1px solid var(--border); }
        .chapter-item { font-size: 0.8rem; padding: 4px 0; border-bottom: 1px solid var(--border); color: var(--muted); }
        .progress-box { display: none; margin-top: 20px; }
        .bar-bg { width: 100%; background: var(--border); border-radius: 10px; height: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s linear; }
        .stats { display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.8rem; font-family: monospace; }
        #downloadLink { display: none; margin-top: 20px; padding: 14px; background: var(--success); color: white; text-decoration: none; border-radius: 12px; font-weight: 600; text-align: center; }
        .merging-mode .bar-fill { animation: shimmer 2s infinite linear; background: linear-gradient(90deg, var(--primary) 25%, #fbbf24 50%, var(--primary) 75%); background-size: 200% 100%; }
        .assembling-mode .bar-fill { animation: shimmer 2s infinite linear; background: linear-gradient(90deg, var(--success) 25%, #34d399 50%, var(--success) 75%); background-size: 200% 100%; }
        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <button class="btn-icon" onclick="toggleLang()" id="langBtn">RU</button>
            <button class="btn-icon" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
        <h1 id="t-title">SonicBook</h1>
        <p id="t-subtitle" style="color: var(--muted); margin-bottom: 20px; font-size: 0.9rem;">Advanced Audiobook Downloader</p>
        
        <input type="text" id="urlInput" placeholder="Paste link here...">
        
        <div class="options-group" id="optGroup">
            <button class="opt-btn active" id="mode-m4b" onclick="setMode('m4b')">M4B (Chapters)</button>
            <button class="opt-btn" id="mode-mp3" onclick="setMode('mp3')">Single File</button>
            <button class="opt-btn" id="mode-zip" onclick="setMode('zip')">ZIP (Split)</button>
        </div>

        <div id="chaptersBox" class="chapters-box">
            <div style="font-weight: 600; margin-bottom: 10px; font-size: 0.85rem;" id="t-found">Chapters found:</div>
            <div id="chaptersList"></div>
        </div>

        <div id="status" style="margin-bottom: 10px; font-size: 0.85rem; display: none;"></div>

        <button id="mainBtn" onclick="handleAction()">Start Download</button>
        
        <div class="progress-box" id="pbox">
            <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
            <div class="stats">
                <span id="perc">0.000%</span>
                <span id="frag">0/0</span>
            </div>
        </div>
        <a id="downloadLink" href="#" target="_blank">📥 Save Result</a>
    </div>

    <script>
        const i18n = {
            en: {
                subtitle: "Advanced Audiobook Downloader", placeholder: "Paste link here...",
                btnStart: "Start Download", btnFetch: "Fetch Info", btnConfirm: "Confirm & Download", btnAgain: "Download Another",
                statusInit: "Initializing...", statusStreams: "Downloading...", statusMerging: "Finalizing & Metadata...",
                statusDone: "Ready!", found: "Chapters found:", noChapters: "No chapters found. Will download as single file.", saveBtn: "📥 Save Result",
                modeSingle: "Single File"
            },
            ru: {
                subtitle: "Продвинутый загрузчик аудиокниг", placeholder: "Вставьте ссылку...",
                btnStart: "Начать загрузку", btnFetch: "Найти главы", btnConfirm: "Подтвердить и скачать", btnAgain: "Загрузить еще одну",
                statusInit: "Инициализация...", statusStreams: "Загрузка...", statusMerging: "Сборка и метаданные...",
                statusDone: "Готово!", found: "Найденные главы:", noChapters: "Главы не найдены. Будет скачано одним файлом.", saveBtn: "📥 Сохранить результат",
                modeSingle: "Одним файлом"
            }
        };

        let currentLang = localStorage.getItem('lang') || 'en';
        let currentMode = 'm4b';
        let step = 'start';

        function setMode(mode) {
            currentMode = mode;
            ['m4b', 'mp3', 'zip'].forEach(m => document.getElementById('mode-'+m).classList.toggle('active', m === mode));
            updateUI();
        }

        function updateUI() {
            const t = i18n[currentLang];
            document.getElementById('t-subtitle').innerText = t.subtitle;
            document.getElementById('urlInput').placeholder = t.placeholder;
            document.getElementById('downloadLink').innerText = t.saveBtn;
            document.getElementById('mode-mp3').innerText = t.modeSingle;
            document.getElementById('langBtn').innerText = currentLang === 'en' ? 'RU' : 'EN';
            document.getElementById('t-found').innerText = t.found;
            const btn = document.getElementById('mainBtn');
            if (step === 'start') btn.innerText = (currentMode === 'm4b' || currentMode === 'zip') ? t.btnFetch : t.btnStart;
            else if (step === 'confirm') btn.innerText = t.btnConfirm;
        }

        function toggleLang() { currentLang = currentLang === 'en' ? 'ru' : 'en'; localStorage.setItem('lang', currentLang); updateUI(); }
        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-theme');
            document.getElementById('themeBtn').innerText = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        // Init
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
            document.getElementById('themeBtn').innerText = '☀️';
        }


        async function handleAction() {
            if (step === 'start') {
                if (currentMode === 'm4b' || currentMode === 'zip') {
                    await fetchInfo();
                } else {
                    await startDownload();
                }
            } else if (step === 'confirm') {
                await startDownload();
            } else if (step === 'done') {
                resetForm();
            }
        }

        function resetForm() {
            document.getElementById('urlInput').value = '';
            document.getElementById('pbox').style.display = 'none';
            document.getElementById('downloadLink').style.display = 'none';
            document.getElementById('status').style.display = 'none';
            document.getElementById('optGroup').style.display = 'flex';
            step = 'start';
            updateUI();
        }

        async function fetchInfo() {
            const url = document.getElementById('urlInput').value.trim();
            if(!url) return;
            const btn = document.getElementById('mainBtn');
            const statusDiv = document.getElementById('status');
            const chaptersBox = document.getElementById('chaptersBox');
            const chaptersList = document.getElementById('chaptersList');
            
            btn.disabled = true;
            statusDiv.style.display = 'block';
            statusDiv.innerText = i18n[currentLang].statusInit;
            chaptersBox.style.display = 'none';
            
            try {
                const res = await fetch('/api/info', { 
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'}, 
                    body: JSON.stringify({url}) 
                });
                
                if (!res.ok) throw new Error('Book info fetch failed');
                const data = await res.json();
                
                if (data.chapters && data.chapters.length > 0) {
                    chaptersList.innerHTML = data.chapters.map((c, i) => `
                        <div class="chapter-item">
                            <span class="chapter-title">${i+1}. ${c.title}</span>
                        </div>
                    `).join('');
                    chaptersBox.style.display = 'block';
                    statusDiv.style.display = 'none';
                } else {
                    statusDiv.innerText = i18n[currentLang].noChapters;
                }
                step = 'confirm'; 
                updateUI();
            } catch(e) { 
                statusDiv.innerText = 'Error: ' + e.message;
                statusDiv.style.color = 'var(--error)';
            } finally { 
                btn.disabled = false; 
            }
        }

        async function startDownload() {
            const url = document.getElementById('urlInput').value.trim();
            if(!url) return;
            document.getElementById('mainBtn').disabled = true;
            document.getElementById('downloadLink').style.display = 'none';
            document.getElementById('chaptersBox').style.display = 'none';
            document.getElementById('optGroup').style.display = 'none';
            document.getElementById('pbox').style.display = 'block';
            document.getElementById('pbox').classList.remove('merging-mode');
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.innerText = i18n[currentLang].statusInit;
            
            try {
                const res = await fetch('/api/download', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({url, mode: currentMode}) });
                const data = await res.json();
                poll(data.task_id);
            } catch(e) { alert(e); document.getElementById('mainBtn').disabled = false; }
        }

        function poll(id) {
            const int = setInterval(async () => {
                const res = await fetch('/api/progress/' + id);
                const data = await res.json();
                const t = i18n[currentLang];
                const statusDiv = document.getElementById('status');
                
                if(data.status === 'processing' || data.status === 'merging') {
                    statusDiv.innerText = data.status === 'merging' ? t.statusMerging : t.statusStreams;
                    if(data.status === 'merging') document.getElementById('pbox').classList.add('merging-mode');
                    document.getElementById('pbox').classList.remove('assembling-mode');
                    document.getElementById('bar').style.width = data.percent + '%';
                    document.getElementById('perc').innerText = data.percent.toFixed(3) + '%';
                    document.getElementById('frag').innerText = `${data.current_frag}/${data.total_frags}`;
                } else if(data.status === 'assembling') {
                    statusDiv.innerText = currentLang === 'en' ? "⚙️ Assembling M4B... Please wait" : "⚙️ Сборка M4B... Пожалуйста, подождите";
                    document.getElementById('pbox').classList.add('assembling-mode');
                    document.getElementById('bar').style.width = '100%';
                    document.getElementById('perc').innerText = '100.000%';
                } else if(data.status === 'success') {
                    clearInterval(int);
                    statusDiv.innerText = t.statusDone;
                    document.getElementById('pbox').classList.remove('assembling-mode');
                    document.getElementById('bar').style.width = '100%';
                    document.getElementById('perc').innerText = '100.000%';
                    document.getElementById('downloadLink').href = '/api/files/' + data.file_name;
                    document.getElementById('downloadLink').style.display = 'block';
                    document.getElementById('mainBtn').disabled = false;
                    document.getElementById('mainBtn').innerText = t.btnAgain;
                    step = 'done';
                }
            }, 1000);
        }
    </script>
</body>
</html>
