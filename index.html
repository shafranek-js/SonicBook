<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicBook Downloader</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container" id="appContainer">
        <!-- Library Panel (Slides from Left) -->
        <div class="library-panel" id="libraryPanel">
            <div class="panel-header">
                <div id="t-lib-title" style="flex-shrink: 0; margin-right: 10px;">My Library</div>
                <input type="text" id="libSearchInput" placeholder="Search..." onkeyup="filterLibrary()" 
                    style="flex-grow: 1; min-width: 0; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
            </div>
            <div class="library-list" id="libraryList">
                <div class="empty-lib">Loading...</div>
            </div>
        </div>

        <!-- Main Card -->
        <div class="main-card">
            <div class="resizer resizer-left" onmousedown="initResize(event, 'main-left')"></div>
            <div class="resizer resizer-right" onmousedown="initResize(event, 'main-right')"></div>
            <div class="main-toolbar">
                <div class="controls-left">
                    <button class="btn-icon" id="resetAllBtn" onclick="resetAllData()" title="Reset All Data">🧹</button>
                </div>
                <div class="folder-row">
                    <span style="color: var(--muted);" id="t-save-path">Save to:</span>
                    <span id="currentPath" class="current-path">...</span>
                    <button onclick="chooseFolder()" id="btn-change-folder" class="folder-btn">Change</button>
                </div>
                <div class="controls">
                    <button class="btn-icon" id="libBtn" onclick="toggleLibrary()" title="Library">📚</button>
                    <button class="btn-icon" onclick="toggleLang()" id="langBtn">RU</button>
                    <button class="btn-icon" onclick="toggleTheme()" id="themeBtn">🌙</button>
                </div>
            </div>

            <input type="text" id="urlInput" placeholder="Paste link here...">
            
            <div class="options-group" id="optGroup">
                <button class="opt-btn active" id="mode-m4b" onclick="setMode('m4b')">M4B (Chapters)</button>
                <button class="opt-btn" id="mode-mp3" onclick="setMode('mp3')">Single File</button>
                <button class="opt-btn" id="mode-zip" onclick="setMode('zip')">ZIP (Split)</button>
            </div>

            <div id="chaptersBox" class="chapters-box">
                <div class="section-label" id="t-found">Chapters found:</div>
                <div id="chaptersList"></div>
            </div>

            <div id="status" class="status-line"></div>

            <button id="mainBtn" onclick="handleAction()">Start Download</button>

            <div class="progress-box" id="pbox">
                <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
                <div class="stats">
                    <span id="perc">0.000%</span>
                    <span id="frag">0/0</span>
                </div>
            </div>

            <!-- Player UI -->
            <div class="player-box" id="playerBox">
                <div class="player-cover-frame" id="playerCoverFrame" onclick="togglePlay()" title="Play / Pause">
                    <div class="player-cover-bg" id="playerCoverBg" aria-hidden="true"></div>
                    <div class="player-cover-overlay" id="playerCoverOverlay" aria-hidden="true">
                        <span class="player-cover-overlay-icon player-icon player-icon-play" id="playerCoverOverlayIcon"></span>
                    </div>
                    <img id="playerCover" src="">
                </div>
                <div class="player-header">
                    <div class="player-title" id="playerTitle">Book Title</div>
                    <button class="player-chapter-btn" id="btn-player-chapters" onclick="toggleChaptersModal()">📑 Chapters</button>
                </div>
                <div class="player-chapter" id="playerChapter">Chapter 1</div>

                <div class="player-controls">
                    <button class="p-btn p-btn-small" type="button" onclick="seekRelative(-15)" aria-label="Back 15 seconds" title="Back 15 seconds">
                        <span class="player-icon player-icon-back" aria-hidden="true"></span>
                    </button>
                    <button class="p-btn" id="playBtn" type="button" onclick="togglePlay()" aria-label="Play" title="Play">
                        <span class="player-icon player-icon-play" id="playBtnIcon" aria-hidden="true"></span>
                    </button>
                    <button class="p-btn p-btn-small" type="button" onclick="seekRelative(15)" aria-label="Forward 15 seconds" title="Forward 15 seconds">
                        <span class="player-icon player-icon-forward" aria-hidden="true"></span>
                    </button>
                </div>

                <div class="timeline-container" id="timeline" onclick="seek(event)">
                    <div class="timeline-fill" id="timelineFill"></div>
                    <div id="markersContainer"></div>
                </div>
                <div class="player-time">
                    <span id="timeCurrent">00:00:00</span>
                    <span id="timeTotal">00:00:00</span>
                </div>
                <audio id="audioElement"></audio>
            </div>
            </div>

            <!-- Chapters Panel (Slides from Right of Main Card) -->
            <div class="chapters-panel" id="chaptersPanel">
            <div class="panel-header" onclick="toggleChaptersModal()">
                <div id="t-panel-title">Table of Contents</div>
            </div>
            <div class="panel-content" id="playerChaptersList">
                <div class="empty-lib" id="t-no-chapters">No chapters available.</div>
            </div>
            </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
