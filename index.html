<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicBook Downloader</title>
    <style>
        :root { --primary: #6366F1; --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --muted: #94A3B8; --success: #10B981; --error: #FB7185; --border: #334155; }
        body.light-theme { --bg: #F3F4F6; --card: #FFFFFF; --text: #1F2937; --muted: #6B7280; --border: #E5E7EB; }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: var(--card); padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 550px; text-align: center; position: relative; }
        .controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
        .btn-icon { background: none; border: 1px solid var(--border); color: var(--muted); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        input { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text); margin-bottom: 15px; outline: none; }
        
        .options-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .opt-btn { flex: 1; padding: 10px 5px; border: 1px solid var(--border); border-radius: 10px; background: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .opt-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(99, 102, 241, 0.1); }

        button#mainBtn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
        button#mainBtn:disabled { opacity: 0.5; }
        
        .chapters-box { display: none; text-align: left; margin: 20px 0; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; max-height: 180px; overflow-y: auto; border: 1px solid var(--border); }
        .chapter-item { font-size: 0.8rem; padding: 4px 0; border-bottom: 1px solid var(--border); color: var(--muted); }
        .progress-box { display: none; margin-top: 20px; }
        .bar-bg { width: 100%; background: var(--border); border-radius: 10px; height: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s linear; }
        .stats { display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.8rem; font-family: monospace; }
        #downloadLink { display: none; margin-top: 20px; padding: 14px; background: var(--success); color: white; text-decoration: none; border-radius: 12px; font-weight: 600; text-align: center; }
        .merging-mode .bar-fill { animation: shimmer 2s infinite linear; background: linear-gradient(90deg, var(--primary) 25%, #fbbf24 50%, var(--primary) 75%); background-size: 200% 100%; }
        .assembling-mode .bar-fill { animation: shimmer 2s infinite linear; background: linear-gradient(90deg, var(--success) 25%, #34d399 50%, var(--success) 75%); background-size: 200% 100%; }
        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

        /* Player UI Styles */
        .player-box { display: none; margin-top: 20px; background: rgba(0,0,0,0.15); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: left; }
        .player-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
        .player-title { font-weight: bold; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-right: 10px; }
        .player-chapter-btn { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; }
        .player-chapter-btn:hover { background: rgba(0,0,0,0.1); }
        .player-chapter { color: var(--primary); font-size: 0.8rem; margin-bottom: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-controls { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .p-btn { background: var(--primary); color: white; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.2rem; }
        .p-btn:hover { opacity: 0.9; transform: scale(1.05); }
        .p-btn-small { background: none; color: var(--text); border: 1px solid var(--border); border-radius: 50%; width: 36px; height: 36px; font-size: 0.9rem; }
        .p-btn-small:hover { background: var(--border); }
        .timeline-container { position: relative; width: 100%; height: 8px; background: var(--border); border-radius: 4px; cursor: pointer; margin-bottom: 8px; }
        .timeline-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--primary); border-radius: 4px; width: 0%; pointer-events: none; }
        .timeline-marker { position: absolute; top: -2px; bottom: -2px; width: 2px; background: rgba(255,255,255,0.3); pointer-events: none; }
        .player-time { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); font-family: monospace; }
        audio { display: none; }

        /* Library Modal Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card); border-radius: 20px; width: 100%; max-width: 600px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid var(--border); overflow: hidden; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 1.2rem; font-weight: bold; }
        .close-btn { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; }
        .library-list { overflow-y: auto; padding: 10px; flex: 1; }
        .library-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.2s; }
        .library-item:hover { background: rgba(0,0,0,0.05); }
        .library-item-info { flex: 1; overflow: hidden; }
        .library-item-title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .library-item-meta { font-size: 0.75rem; color: var(--muted); }
        .library-item-play { color: var(--primary); font-size: 1.2rem; padding-left: 15px; }
        .empty-lib { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 0.9rem; }
        
        /* Chapters List Styling inside Modal */
        .chapter-list-item { font-size: 0.85rem; padding: 12px 15px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.2s; display: flex; justify-content: space-between; }
        .chapter-list-item:hover { background: rgba(0,0,0,0.05); }
        .chapter-list-item.active-ch { background: rgba(99, 102, 241, 0.1); border-left: 4px solid var(--primary); padding-left: 11px; font-weight: 600; color: var(--primary); }
    </style>
</head>
<body>
    <!-- Library Modal -->
    <div class="modal-overlay" id="libraryModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="t-lib-title">My Library</div>
                <button class="close-btn" onclick="toggleLibrary()">×</button>
            </div>
            <div class="library-list" id="libraryList">
                <div class="empty-lib">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Chapters Modal -->
    <div class="modal-overlay" id="chaptersModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Table of Contents</div>
                <button class="close-btn" onclick="toggleChaptersModal()">×</button>
            </div>
            <div class="library-list" id="playerChaptersList">
                <div class="empty-lib">No chapters available.</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="controls">
            <button class="btn-icon" onclick="toggleLibrary()" title="Library">📚</button>
            <button class="btn-icon" onclick="toggleLang()" id="langBtn">RU</button>
            <button class="btn-icon" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
        <h1 id="t-title">SonicBook</h1>
        <p id="t-subtitle" style="color: var(--muted); margin-bottom: 20px; font-size: 0.9rem;">Advanced Audiobook Downloader</p>
        
        <input type="text" id="urlInput" placeholder="Paste link here...">
        
        <div class="options-group" id="optGroup">
            <button class="opt-btn active" id="mode-m4b" onclick="setMode('m4b')">M4B (Chapters)</button>
            <button class="opt-btn" id="mode-mp3" onclick="setMode('mp3')">Single File</button>
            <button class="opt-btn" id="mode-zip" onclick="setMode('zip')">ZIP (Split)</button>
        </div>

        <div style="font-size: 0.8rem; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <span style="color: var(--muted);" id="t-save-path">Save to:</span>
            <span id="currentPath" style="font-family: monospace; background: rgba(0,0,0,0.1); padding: 4px 8px; border-radius: 6px; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">...</span>
            <button onclick="chooseFolder()" style="background: none; border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;">Change</button>
        </div>

        <div id="chaptersBox" class="chapters-box">
            <div style="font-weight: 600; margin-bottom: 10px; font-size: 0.85rem;" id="t-found">Chapters found:</div>
            <div id="chaptersList"></div>
        </div>

        <div id="status" style="margin-bottom: 10px; font-size: 0.85rem; display: none;"></div>

        <button id="mainBtn" onclick="handleAction()">Start Download</button>
        
        <div class="progress-box" id="pbox">
            <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
            <div class="stats">
                <span id="perc">0.000%</span>
                <span id="frag">0/0</span>
            </div>
        </div>
        <a id="downloadLink" href="#" target="_blank">📥 Save Result</a>

        <!-- Player UI -->
        <div class="player-box" id="playerBox">
            <div class="player-header">
                <div class="player-title" id="playerTitle">Book Title</div>
                <button class="player-chapter-btn" onclick="toggleChaptersModal()">📑 Chapters</button>
            </div>
            <div class="player-chapter" id="playerChapter">Chapter 1</div>
            
            <div class="player-controls">
                <button class="p-btn p-btn-small" onclick="seekRelative(-15)">⏪</button>
                <button class="p-btn" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="p-btn p-btn-small" onclick="seekRelative(15)">⏩</button>
            </div>
            
            <div class="timeline-container" id="timeline" onclick="seek(event)">
                <div class="timeline-fill" id="timelineFill"></div>
                <div id="markersContainer"></div>
            </div>
            <div class="player-time">
                <span id="timeCurrent">00:00:00</span>
                <span id="timeTotal">00:00:00</span>
            </div>
            <audio id="audioElement"></audio>
        </div>

    </div>

    <script>
        const i18n = {
            en: {
                subtitle: "Advanced Audiobook Downloader", placeholder: "Paste link here...",
                btnStart: "Start Download", btnFetch: "Fetch Info", btnConfirm: "Confirm & Download", btnAgain: "Download Another",
                statusInit: "Initializing...", statusStreams: "Downloading...", statusMerging: "Finalizing & Metadata...",
                statusDone: "Ready!", found: "Chapters found:", noChapters: "No chapters found. Will download as single file.", saveBtn: "📥 Save Result",
                modeSingle: "Single File"
            },
            ru: {
                subtitle: "Продвинутый загрузчик аудиокниг", placeholder: "Вставьте ссылку...",
                btnStart: "Начать загрузку", btnFetch: "Найти главы", btnConfirm: "Подтвердить и скачать", btnAgain: "Загрузить еще одну",
                statusInit: "Инициализация...", statusStreams: "Загрузка...", statusMerging: "Сборка и метаданные...",
                statusDone: "Готово!", found: "Найденные главы:", noChapters: "Главы не найдены. Будет скачано одним файлом.", saveBtn: "📥 Сохранить результат",
                modeSingle: "Одним файлом"
            }
        };

        let currentLang = localStorage.getItem('lang') || 'en';
        let currentMode = 'm4b';
        let step = 'start';

        function setMode(mode) {
            currentMode = mode;
            ['m4b', 'mp3', 'zip'].forEach(m => document.getElementById('mode-'+m).classList.toggle('active', m === mode));
            updateUI();
        }

        function updateUI() {
            const t = i18n[currentLang];
            document.getElementById('t-subtitle').innerText = t.subtitle;
            document.getElementById('urlInput').placeholder = t.placeholder;
            document.getElementById('downloadLink').innerText = t.saveBtn;
            document.getElementById('mode-mp3').innerText = t.modeSingle;
            document.getElementById('langBtn').innerText = currentLang === 'en' ? 'RU' : 'EN';
            document.getElementById('t-found').innerText = t.found;
            const btn = document.getElementById('mainBtn');
            if (step === 'start') btn.innerText = (currentMode === 'm4b' || currentMode === 'zip') ? t.btnFetch : t.btnStart;
            else if (step === 'confirm') btn.innerText = t.btnConfirm;
        }

        function toggleLang() { currentLang = currentLang === 'en' ? 'ru' : 'en'; localStorage.setItem('lang', currentLang); updateUI(); }
        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-theme');
            document.getElementById('themeBtn').innerText = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        // Init
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
            document.getElementById('themeBtn').innerText = '☀️';
        }
        
        async function initFolder() {
            try {
                const res = await fetch('/api/settings/folder');
                const data = await res.json();
                document.getElementById('currentPath').innerText = data.folder;
                document.getElementById('currentPath').title = data.folder;
            } catch(e) {}
        }
        initFolder();

        async function chooseFolder() {
            try {
                document.getElementById('currentPath').innerText = "Loading dialog...";
                const res = await fetch('/api/settings/choose_folder', {method: 'POST'});
                const data = await res.json();
                document.getElementById('currentPath').innerText = data.folder;
                document.getElementById('currentPath').title = data.folder;
            } catch(e) {
                initFolder();
            }
        }

        async function handleAction() {
            if (step === 'start') {
                if (currentMode === 'm4b' || currentMode === 'zip') {
                    await fetchInfo();
                } else {
                    await startDownload();
                }
            } else if (step === 'confirm') {
                await startDownload();
            } else if (step === 'done') {
                resetForm();
            }
        }

        function resetForm() {
            document.getElementById('urlInput').value = '';
            document.getElementById('pbox').style.display = 'none';
            document.getElementById('downloadLink').style.display = 'none';
            document.getElementById('status').style.display = 'none';
            document.getElementById('optGroup').style.display = 'flex';
            document.getElementById('playerBox').style.display = 'none';
            if (!audio.paused) {
                audio.pause();
            }
            step = 'start';
            updateUI();
        }

        // Library Logic
        function toggleLibrary() {
            const modal = document.getElementById('libraryModal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                loadLibrary();
            }
        }

        async function loadLibrary() {
            const listDiv = document.getElementById('libraryList');
            listDiv.innerHTML = '<div class="empty-lib">Loading...</div>';
            try {
                const res = await fetch('/api/library');
                const data = await res.json();
                
                if (data.files.length === 0) {
                    listDiv.innerHTML = '<div class="empty-lib">Your library is empty.</div>';
                    return;
                }

                listDiv.innerHTML = data.files.map(f => {
                    const date = new Date(f.mtime * 1000).toLocaleDateString();
                    return `
                        <div class="library-item" onclick="playFromLibrary('${f.name}')">
                            <div class="library-item-info">
                                <div class="library-item-title">${f.name}</div>
                                <div class="library-item-meta">${f.size_mb} MB • ${date} ${f.has_meta ? '• 📑 Chapters' : ''}</div>
                            </div>
                            <div class="library-item-play">▶</div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                listDiv.innerHTML = '<div class="empty-lib" style="color: var(--error);">Failed to load library</div>';
            }
        }

        function playFromLibrary(fileName) {
            toggleLibrary(); // Close modal
            resetForm(); // Hide download UI
            step = 'done'; // Set state to done so "Download Another" works correctly
            document.getElementById('mainBtn').innerText = i18n[currentLang].btnAgain;
            initPlayer(fileName);
            // Auto play
            setTimeout(() => {
                audio.play();
                document.getElementById('playBtn').innerText = '⏸';
            }, 500);
        }

        async function fetchInfo() {
            const url = document.getElementById('urlInput').value.trim();
            if(!url) return;
            const btn = document.getElementById('mainBtn');
            const statusDiv = document.getElementById('status');
            const chaptersBox = document.getElementById('chaptersBox');
            const chaptersList = document.getElementById('chaptersList');
            
            btn.disabled = true;
            statusDiv.style.display = 'block';
            statusDiv.innerText = i18n[currentLang].statusInit;
            chaptersBox.style.display = 'none';
            
            try {
                const res = await fetch('/api/info', { 
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'}, 
                    body: JSON.stringify({url}) 
                });
                
                if (!res.ok) throw new Error('Book info fetch failed');
                const data = await res.json();
                
                if (data.chapters && data.chapters.length > 0) {
                    chaptersList.innerHTML = data.chapters.map((c, i) => `
                        <div class="chapter-item">
                            <span class="chapter-title">${i+1}. ${c.title}</span>
                        </div>
                    `).join('');
                    chaptersBox.style.display = 'block';
                    statusDiv.style.display = 'none';
                } else {
                    statusDiv.innerText = i18n[currentLang].noChapters;
                }
                step = 'confirm'; 
                updateUI();
            } catch(e) { 
                statusDiv.innerText = 'Error: ' + e.message;
                statusDiv.style.color = 'var(--error)';
            } finally { 
                btn.disabled = false; 
            }
        }

        async function startDownload() {
            const url = document.getElementById('urlInput').value.trim();
            if(!url) return;
            document.getElementById('mainBtn').disabled = true;
            document.getElementById('downloadLink').style.display = 'none';
            document.getElementById('chaptersBox').style.display = 'none';
            document.getElementById('optGroup').style.display = 'none';
            document.getElementById('pbox').style.display = 'block';
            document.getElementById('pbox').classList.remove('merging-mode');
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.innerText = i18n[currentLang].statusInit;
            
            try {
                const res = await fetch('/api/download', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({url, mode: currentMode}) });
                const data = await res.json();
                poll(data.task_id);
            } catch(e) { alert(e); document.getElementById('mainBtn').disabled = false; }
        }

        let playerState = {
            mode: 'single', // 'single', 'm4b', 'zip'
            duration: 0,
            chapters: [], // For m4b/mp3
            playlist: [], // For zip
            currentTrackIndex: 0,
            fileName: null,
            bookTitle: ""
        };

        const audio = document.getElementById('audioElement');

        audio.addEventListener('timeupdate', () => {
            if(!playerState.duration) return;
            const pct = (audio.currentTime / playerState.duration) * 100;
            document.getElementById('timelineFill').style.width = pct + '%';
            document.getElementById('timeCurrent').innerText = formatTime(audio.currentTime);
            
            // Update current chapter text
            if (playerState.mode === 'zip' && playerState.playlist.length > 0) {
                const track = playerState.playlist[playerState.currentTrackIndex];
                document.getElementById('playerChapter').innerText = `${playerState.currentTrackIndex + 1} / ${playerState.playlist.length}: ${track.title}`;
            } else if(playerState.chapters.length > 0) {
                const currentCh = playerState.chapters.find(c => audio.currentTime >= c.start && audio.currentTime < c.end) || playerState.chapters[0];
                document.getElementById('playerChapter').innerText = currentCh.title;
            }
            
            // Save bookmark
            if(playerState.fileName) {
                const bmk = {
                    time: audio.currentTime,
                    track: playerState.currentTrackIndex
                };
                localStorage.setItem('bookmark_' + playerState.fileName, JSON.stringify(bmk));
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            playerState.duration = audio.duration;
            document.getElementById('timeTotal').innerText = formatTime(audio.duration);
            
            // Restore bookmark ONLY if we just loaded the file manually (not auto-playing next track)
            if(playerState.fileName && !audio.autoplay) {
                try {
                    const saved = JSON.parse(localStorage.getItem('bookmark_' + playerState.fileName));
                    if(saved && saved.time) audio.currentTime = parseFloat(saved.time);
                } catch(e) {}
            }
        });

        audio.addEventListener('ended', () => {
            if (playerState.mode === 'zip' && playerState.currentTrackIndex < playerState.playlist.length - 1) {
                // Play next track in ZIP
                playerState.currentTrackIndex++;
                playCurrentTrack(true);
            } else {
                document.getElementById('playBtn').innerText = '▶';
            }
        });

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                document.getElementById('playBtn').innerText = '⏸';
            } else {
                audio.pause();
                document.getElementById('playBtn').innerText = '▶';
            }
        }

        function seekRelative(seconds) {
            audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + seconds));
        }

        function seek(event) {
            if(!playerState.duration) return;
            const timeline = document.getElementById('timeline');
            const rect = timeline.getBoundingClientRect();
            const pos = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
            audio.currentTime = pos * playerState.duration;
        }

        function formatTime(secs) {
            if(isNaN(secs)) return "00:00:00";
            const h = Math.floor(secs / 3600);
            const m = Math.floor((secs % 3600) / 60);
            const s = Math.floor(secs % 60);
            return [h, m, s].map(v => v.toString().padStart(2, '0')).join(':');
        }

        // Chapters Modal Logic
        function toggleChaptersModal() {
            const modal = document.getElementById('chaptersModal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                renderPlayerChapters();
            }
        }

        function renderPlayerChapters() {
            const listDiv = document.getElementById('playerChaptersList');
            
            if (playerState.mode === 'zip') {
                if (!playerState.playlist || playerState.playlist.length === 0) {
                    listDiv.innerHTML = '<div class="empty-lib">No tracks available.</div>';
                    return;
                }
                listDiv.innerHTML = playerState.playlist.map((track, idx) => {
                    const isActive = idx === playerState.currentTrackIndex ? 'active-ch' : '';
                    return `
                        <div class="chapter-list-item ${isActive}" onclick="jumpToTrack(${idx})">
                            <span>${idx + 1}. ${track.title}</span>
                        </div>
                    `;
                }).join('');
            } else {
                if (!playerState.chapters || playerState.chapters.length === 0) {
                    listDiv.innerHTML = '<div class="empty-lib">No chapters available for this book.</div>';
                    return;
                }
                
                const currentChIndex = playerState.chapters.findIndex(c => audio.currentTime >= c.start && audio.currentTime < c.end) || 0;

                listDiv.innerHTML = playerState.chapters.map((ch, idx) => {
                    const isActive = idx === currentChIndex ? 'active-ch' : '';
                    return `
                        <div class="chapter-list-item ${isActive}" onclick="jumpToChapter(${ch.start})">
                            <span>${idx + 1}. ${ch.title}</span>
                            <span>${formatTime(ch.start)}</span>
                        </div>
                    `;
                }).join('');
            }
            
            // Scroll to active chapter
            setTimeout(() => {
                const activeEl = listDiv.querySelector('.active-ch');
                if(activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        function jumpToChapter(startTime) {
            audio.currentTime = startTime;
            if (audio.paused) togglePlay();
            toggleChaptersModal();
        }

        function jumpToTrack(index) {
            playerState.currentTrackIndex = index;
            playCurrentTrack(true);
            toggleChaptersModal();
        }

        function playCurrentTrack(autoplay = false) {
            if (playerState.playlist.length === 0) return;
            const track = playerState.playlist[playerState.currentTrackIndex];
            // Fix URI encoding for file paths
            const parts = track.file.split('/');
            const encodedPath = parts.map(p => encodeURIComponent(p)).join('/');
            
            audio.src = '/api/files/' + encodedPath;
            audio.autoplay = autoplay;
            audio.load();
            if (autoplay) {
                document.getElementById('playBtn').innerText = '⏸';
            }
            document.getElementById('playerChapter').innerText = `${playerState.currentTrackIndex + 1} / ${playerState.playlist.length}: ${track.title}`;
        }

        async function initPlayer(fileName) {
            playerState.fileName = fileName;
            playerState.chapters = [];
            playerState.playlist = [];
            playerState.currentTrackIndex = 0;
            playerState.mode = 'single';
            
            document.getElementById('markersContainer').innerHTML = '';
            document.getElementById('playerBox').style.display = 'block';
            document.getElementById('playerTitle').innerText = fileName;
            document.getElementById('playerChapter').innerText = '';
            document.getElementById('playBtn').innerText = '▶';
            audio.autoplay = false;

            // Try loading bookmark to see if we have a track index saved
            let savedBmk = null;
            try {
                // Handle legacy bookmarks (which were just floats)
                const rawBmk = localStorage.getItem('bookmark_' + fileName);
                if (rawBmk && !rawBmk.startsWith('{')) {
                    savedBmk = { time: parseFloat(rawBmk), track: 0 };
                } else if (rawBmk) {
                    savedBmk = JSON.parse(rawBmk);
                }
                
                if (savedBmk && savedBmk.track !== undefined) {
                    playerState.currentTrackIndex = savedBmk.track;
                }
            } catch(e) {}

            try {
                const res = await fetch('/api/metadata/' + fileName);
                if(res.ok) {
                    const meta = await res.json();
                    if(meta.title) {
                        playerState.bookTitle = meta.title;
                        document.getElementById('playerTitle').innerText = meta.title;
                    }
                    
                    if (meta.mode === 'zip' && meta.playlist) {
                        playerState.mode = 'zip';
                        playerState.playlist = meta.playlist;
                        playCurrentTrack(false);
                        
                        // Apply time bookmark for zip if exists
                        if (savedBmk && savedBmk.time) {
                            audio.addEventListener('loadedmetadata', function onMeta() {
                                audio.currentTime = parseFloat(savedBmk.time);
                                audio.removeEventListener('loadedmetadata', onMeta);
                            });
                        }
                        return; // Return early, standard audio load is handled by playCurrentTrack
                    } else if(meta.chapters && meta.chapters.length > 0) {
                        playerState.mode = 'm4b';
                        playerState.chapters = meta.chapters;
                        // Draw markers if duration is known from metadata
                        const lastCh = meta.chapters[meta.chapters.length - 1];
                        const totalMetaDur = lastCh.end;
                        if(totalMetaDur > 0) {
                            const markersHtml = meta.chapters.map(ch => {
                                const leftPct = (ch.start / totalMetaDur) * 100;
                                return `<div class="timeline-marker" style="left: ${leftPct}%;" title="${ch.title}"></div>`;
                            }).join('');
                            document.getElementById('markersContainer').innerHTML = markersHtml;
                        }
                    }
                }
            } catch(e) { console.log('No metadata found', e); }

            // Default fallback for single/m4b
            // Fix URI encoding for file paths
            audio.src = '/api/files/' + encodeURIComponent(fileName);
            audio.load();
            
            if (savedBmk && savedBmk.time) {
                audio.addEventListener('loadedmetadata', function onMeta() {
                    audio.currentTime = parseFloat(savedBmk.time);
                    audio.removeEventListener('loadedmetadata', onMeta);
                });
            }
        }

        function poll(id) {
            const int = setInterval(async () => {
                const res = await fetch('/api/progress/' + id);
                const data = await res.json();
                const t = i18n[currentLang];
                const statusDiv = document.getElementById('status');
                
                if(data.status === 'processing' || data.status === 'merging') {
                    statusDiv.innerText = data.status === 'merging' ? t.statusMerging : t.statusStreams;
                    if(data.status === 'merging') document.getElementById('pbox').classList.add('merging-mode');
                    document.getElementById('pbox').classList.remove('assembling-mode');
                    document.getElementById('bar').style.width = data.percent + '%';
                    document.getElementById('perc').innerText = data.percent.toFixed(3) + '%';
                    document.getElementById('frag').innerText = `${data.current_frag}/${data.total_frags}`;
                } else if(data.status === 'assembling') {
                    statusDiv.innerText = currentLang === 'en' ? "⚙️ Assembling M4B... Please wait" : "⚙️ Сборка M4B... Пожалуйста, подождите";
                    document.getElementById('pbox').classList.add('assembling-mode');
                    document.getElementById('bar').style.width = '100%';
                    document.getElementById('perc').innerText = '100.000%';
                } else if(data.status === 'success') {
                    clearInterval(int);
                    statusDiv.innerText = t.statusDone;
                    document.getElementById('pbox').classList.remove('assembling-mode');
                    document.getElementById('bar').style.width = '100%';
                    document.getElementById('perc').innerText = '100.000%';
                    document.getElementById('downloadLink').href = '/api/files/' + data.file_name;
                    document.getElementById('downloadLink').style.display = 'block';
                    document.getElementById('mainBtn').disabled = false;
                    document.getElementById('mainBtn').innerText = t.btnAgain;
                    step = 'done';
                    
                    // Initialize the integrated player
                    initPlayer(data.file_name);
                }
            }, 1000);
        }
    </script>
</body>
</html>
